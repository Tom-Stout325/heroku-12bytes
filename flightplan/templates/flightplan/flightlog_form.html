<form method="post" enctype="multipart/form-data">
  {% csrf_token %}
  {{ form.non_field_errors }}
  <div class="mb-3">
    {{ form.csv_file.label_tag }}
    {{ form.csv_file }}
    {{ form.csv_file.errors }}
  </div>
  <button class="btn btn-primary" type="submit">Upload</button>
</form>

{% if messages %}
  {% for m in messages %}
    <div class="alert alert-{{ m.tags }}">{{ m }}</div>
  {% endfor %}
{% endif %}
